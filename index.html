<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>SAMURAI STORE | متجر ألعاب PlayStation</title>
<meta name="description" content="SAMURAI STORE - متجرك الأول لألعاب PlayStation 5 و PlayStation 4 والاشتراكات والإكسسوارات">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Reem+Kufi:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg-main: #0A0A0F;
    --bg-secondary: #1A0A10;
    --bg-card: #150508;
    --accent: #E63946;
    --accent-dark: #8B0000;
    --accent-light: #FF4D5E;
    --accent-gradient: linear-gradient(135deg, #E63946 0%, #8B0000 100%);
    --accent-gradient-soft: linear-gradient(135deg, rgba(230,57,70,0.15) 0%, rgba(139,0,0,0.15) 100%);
    --gold: #FFB800;
    --green: #06D6A0;
    --text: #FFFFFF;
    --text-secondary: #B8A0A5;
    --border: rgba(230,57,70,0.18);
    --shadow-red: 0 10px 40px rgba(230,57,70,0.35);
    --shadow-red-strong: 0 20px 60px rgba(230,57,70,0.55);
}

html { scroll-behavior: smooth; }

body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg-main);
    background-image: 
        radial-gradient(circle at 0% 0%, rgba(139,0,0,0.15) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(230,57,70,0.1) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
}

a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
ul { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

/* NAVBAR */
.navbar {
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.logo { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }

.logo-icon {
    width: 44px; height: 44px;
    background: var(--accent-gradient);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: #fff;
    box-shadow: var(--shadow-red);
    position: relative; overflow: hidden;
}

.logo-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
}

.logo-text h1 {
    font-size: 1.15rem;
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 900;
    line-height: 1;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
}

.logo-text span { font-size: 0.6rem; color: var(--text-secondary); letter-spacing: 4px; font-weight: 600; }

.nav-actions { display: flex; align-items: center; gap: 8px; }

.nav-icon-btn {
    width: 42px; height: 42px;
    background: var(--bg-secondary);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.1rem;
    transition: all 0.3s;
    border: 1px solid var(--border);
}

.nav-icon-btn:hover, .nav-icon-btn:active {
    background: var(--accent-gradient);
    border-color: transparent;
    transform: scale(1.05);
    box-shadow: var(--shadow-red);
}

.nav-icon-btn.whatsapp {
    background: linear-gradient(135deg, #25D366, #128C7E);
    border-color: transparent;
    box-shadow: 0 6px 20px rgba(37,211,102,0.3);
}

/* HERO */
.hero-section { padding: 20px 0 30px; }

.hero-slider {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(230,57,70,0.15);
}

.hero-slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    cursor: pointer;
    background-size: cover;
    background-position: center;
}

.hero-slide.active { opacity: 1; z-index: 2; }

.hero-slide::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, transparent 30%, rgba(10,10,15,0.6) 70%, rgba(10,10,15,0.98) 100%);
    z-index: 1;
}

.hero-content {
    position: absolute; bottom: 0; right: 0; left: 0;
    padding: 24px 20px;
    z-index: 3;
    text-align: right;
}

.hero-badge {
    display: inline-block;
    background: var(--accent-gradient);
    color: #fff;
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-red);
}

.hero-content h2 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 8px;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

.hero-content .hero-price {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 14px;
    display: block;
}

.btn-hero {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-gradient);
    color: #fff;
    padding: 12px 28px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    transition: all 0.3s;
    box-shadow: var(--shadow-red);
}

.btn-hero:hover, .btn-hero:active {
    transform: translateY(-2px);
    box-shadow: var(--shadow-red-strong);
}

.slider-dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 10;
}

.dot {
    width: 8px; height: 8px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s;
}

.dot.active {
    background: var(--accent);
    width: 24px;
    border-radius: 4px;
    box-shadow: var(--shadow-red);
}

/* SECTIONS */
.section { padding: 30px 0; }

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-header h2 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
}

.section-header h2::before {
    content: '';
    width: 4px;
    height: 24px;
    background: var(--accent-gradient);
    border-radius: 2px;
    box-shadow: var(--shadow-red);
}

.view-all-btn {
    color: var(--accent-light);
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
    padding: 8px 14px;
    border-radius: 50px;
    background: var(--accent-gradient-soft);
    border: 1px solid var(--border);
}

.view-all-btn:hover, .view-all-btn:active {
    background: var(--accent-gradient);
    color: #fff;
    gap: 10px;
    box-shadow: var(--shadow-red);
}

/* GRID */
.games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.game-card {
    background: var(--bg-card);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid var(--border);
    position: relative;
}

.game-card:active { transform: scale(0.98); }
.game-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-red);
    transform: translateY(-4px);
}

.game-image {
    position: relative;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: linear-gradient(135deg, #1A0A10 0%, #0A0A0F 100%);
}

.game-image img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
}

.game-card:hover .game-image img { transform: scale(1.08); }

.game-badge {
    position: absolute;
    top: 10px; right: 10px;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 0.65rem;
    font-weight: 800;
    color: #fff;
    z-index: 2;
    backdrop-filter: blur(10px);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

.badge-pre { background: var(--accent-gradient); box-shadow: var(--shadow-red); }
.badge-new { background: linear-gradient(135deg, #06D6A0, #059669); color: #000; box-shadow: 0 4px 15px rgba(6,214,160,0.4); }
.badge-hot { background: linear-gradient(135deg, #FFB800, #D97706); color: #000; box-shadow: 0 4px 15px rgba(255,184,0,0.4); }
.badge-other { background: linear-gradient(135deg, #6C5CE7, #4C1D95); box-shadow: 0 4px 15px rgba(108,92,231,0.4); }
.badge-sub { background: linear-gradient(135deg, #00B4D8, #0077B6); box-shadow: 0 4px 15px rgba(0,180,216,0.4); }
.badge-acc { background: linear-gradient(135deg, #F77F00, #D62828); box-shadow: 0 4px 15px rgba(247,127,0,0.4); }

.game-info { padding: 12px; }

.game-info h3 {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 36px;
}

.game-price {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--accent-light);
    display: flex;
    align-items: center;
    gap: 4px;
}

.game-price small { color: var(--text-secondary); font-weight: 400; font-size: 0.7rem; }

/* LOAD MORE */
.load-more-container { text-align: center; padding: 24px 0; display: none; }

.load-more-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent-gradient);
    color: #fff;
    padding: 14px 40px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 0.95rem;
    transition: all 0.3s;
    box-shadow: var(--shadow-red);
}

.load-more-btn:hover, .load-more-btn:active {
    transform: translateY(-3px);
    box-shadow: var(--shadow-red-strong);
}

/* PAGES */
.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* SEARCH */
.search-section { padding: 16px 0; }

.search-bar { position: relative; width: 100%; }

.search-bar input {
    width: 100%;
    padding: 14px 48px 14px 20px;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: 50px;
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s;
}

.search-bar input:focus {
    border-color: var(--accent);
    background: var(--bg-card);
    box-shadow: 0 0 0 4px rgba(230,57,70,0.15), var(--shadow-red);
}

.search-bar input::placeholder { color: var(--text-secondary); }

.search-bar i {
    position: absolute;
    right: 20px; top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 1rem;
    pointer-events: none;
}

/* FILTERS */
.filters-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
    scrollbar-width: none;
}

.filters-bar::-webkit-scrollbar { display: none; }

.filter-btn {
    padding: 10px 20px;
    background: var(--bg-secondary);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 0.82rem;
    white-space: nowrap;
    transition: all 0.3s;
    flex-shrink: 0;
}

.filter-btn:hover, .filter-btn:active { border-color: var(--accent); color: var(--accent-light); }

.filter-btn.active {
    background: var(--accent-gradient);
    border-color: transparent;
    color: #fff;
    box-shadow: var(--shadow-red);
}

.results-count {
    color: var(--text-secondary);
    font-size: 0.85rem;
    padding: 0 4px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.results-count strong { color: var(--accent-light); font-size: 1rem; }

.no-results { text-align: center; padding: 60px 20px; display: none; }
.no-results.show { display: block; }
.no-results i { font-size: 3rem; color: var(--accent); opacity: 0.4; margin-bottom: 16px; }
.no-results h3 { font-size: 1.2rem; color: #fff; margin-bottom: 8px; }
.no-results p { color: var(--text-secondary); font-size: 0.9rem; }

/* LOADING */
.loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    background: var(--bg-main);
}

.loading-spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--bg-secondary);
    border-top-color: var(--accent);
    border-right-color: var(--accent-dark);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 30px rgba(230,57,70,0.3);
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-screen p {
    color: var(--text-secondary);
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 1.05rem;
}

/* GAME DETAIL */
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-secondary);
    color: #fff;
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    transition: all 0.3s;
}

.back-btn:hover, .back-btn:active {
    background: var(--accent-gradient);
    border-color: transparent;
    box-shadow: var(--shadow-red);
}

.game-hero {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    margin-bottom: 20px;
    background-size: cover;
    background-position: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(230,57,70,0.15);
}

.game-hero::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, transparent 30%, rgba(10,10,15,0.7) 70%, rgba(10,10,15,0.98) 100%);
}

.game-hero-content {
    position: absolute; bottom: 0; right: 0; left: 0;
    padding: 20px;
    z-index: 2;
    display: flex;
    gap: 16px;
    align-items: flex-end;
}

.game-cover-box {
    width: 90px;
    flex-shrink: 0;
    aspect-ratio: 2/3;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    border: 2px solid var(--accent);
    transform: translateY(-8px);
}

.game-cover-box img { width: 100%; height: 100%; object-fit: cover; }

.game-hero-info { flex: 1; padding-bottom: 4px; }

.game-hero-info h1 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    color: #fff;
    margin-bottom: 10px;
    line-height: 1.2;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

.game-meta { display: flex; gap: 16px; flex-wrap: wrap; }
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 0.6rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.meta-value { font-size: 0.72rem; font-weight: 700; color: #fff; line-height: 1.3; }

.detail-section {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
}

.detail-section::before {
    content: '';
    position: absolute; top: 0; right: 0; left: 0;
    height: 2px;
    background: var(--accent-gradient);
}

.detail-section h2 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
}

.detail-section h2 i { color: var(--accent-light); font-size: 1rem; }

.detail-section p { color: var(--text-secondary); font-size: 0.85rem; line-height: 1.8; white-space: pre-line; }

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

.video-wrapper iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
}

.platform-title {
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--accent-light);
    margin: 16px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.platform-title:first-child { margin-top: 0; }

.variants-list { display: flex; flex-direction: column; gap: 8px; }

.variant-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    background: var(--bg-secondary);
    border-radius: 12px;
    border: 1px solid var(--border);
    transition: all 0.3s;
    cursor: pointer;
}

.variant-item:active { transform: scale(0.98); border-color: var(--accent); }
.variant-item:hover { border-color: var(--accent); box-shadow: var(--shadow-red); }
.variant-item.out-of-stock { opacity: 0.4; cursor: not-allowed; }
.variant-item.out-of-stock:hover { border-color: var(--border); box-shadow: none; }

.variant-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.variant-title { font-weight: 700; font-size: 0.82rem; color: #fff; }
.variant-region { font-size: 0.7rem; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }

.variant-price-box { text-align: left; display: flex; flex-direction: column; gap: 2px; }
.variant-old-price {
    font-size: 0.7rem;
    color: var(--text-secondary);
    text-decoration: line-through;
}
.variant-price {
    font-size: 1rem;
    font-weight: 900;
    color: var(--accent-light);
    font-family: 'Reem Kufi', sans-serif;
}

.btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 800;
    transition: all 0.3s;
    margin-top: 16px;
    box-shadow: 0 10px 30px rgba(37,211,102,0.3);
}

.btn-whatsapp:hover, .btn-whatsapp:active {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(37,211,102,0.5);
}

/* MOBILE NAV */
.mobile-nav {
    position: fixed;
    bottom: 0; right: 0; left: 0;
    background: rgba(26,10,16,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 999;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5), 0 -4px 30px rgba(230,57,70,0.1);
}

.mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    color: var(--text-secondary);
    font-size: 0.7rem;
    font-weight: 700;
    transition: all 0.3s;
    border-radius: 12px;
    cursor: pointer;
}

.mobile-nav-item i { font-size: 1.2rem; }

.mobile-nav-item.active {
    color: var(--accent-light);
    background: var(--accent-gradient-soft);
}

/* RESPONSIVE */
@media (min-width: 640px) {
    .container { padding: 0 24px; }
    .games-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .hero-content h2 { font-size: 2.2rem; }
    .game-hero-info h1 { font-size: 1.8rem; }
    .game-cover-box { width: 120px; }
    .game-info h3 { font-size: 0.95rem; min-height: 40px; }
}

@media (min-width: 1024px) {
    .container { padding: 0 32px; }
    .navbar { padding: 16px 0; }
    .logo-text h1 { font-size: 1.5rem; }
    .logo-icon { width: 52px; height: 52px; font-size: 1.6rem; }
    .hero-slider { aspect-ratio: 16/6; border-radius: 24px; }

<script>
// ============================================
// ⚙️ الإعدادات
// ============================================
const WHATSAPP_NUMBER = '201021386007';
const SAMURAI_BASE_URL = 'https://samuraistore.site';
const GAMES_PER_PAGE = 20;

// الروابط الثلاثة
const SAMURAI_GAMES_URL = 'https://cdn.jsdelivr.net/gh/ahmedabdelmeniem51-oss/mm@main/samurai-games-425.json';
const BREAKERS_URL = 'https://raw.githubusercontent.com/ahmedabdelmeniem51-oss/GAME./main/breakers-games-509.json';
const SAMURAI_SUBS_URL = 'https://cdn.jsdelivr.net/gh/ahmedabdelmeniem51-oss/mm@main/samurai-subscriptions-9.json';
const SAMURAI_ACC_URL = 'https://cdn.jsdelivr.net/gh/ahmedabdelmeniem51-oss/mm@main/samurai-accessories-1.json';

// ============================================
// البيانات
// ============================================
let gamesData = [];
let previousPage = 'home';
let currentSlide = 0;
let totalSlides = 0;
let sliderInterval;
let currentFilter = 'all';
let currentQuery = '';
let displayedCount = GAMES_PER_PAGE;

// ============================================
// أدوات مساعدة
// ============================================
function getEmbedUrl(url) {
    if (!url) return '';
    let videoId = '';
    if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('youtube.com/watch')) {
        try { videoId = new URL(url).searchParams.get('v'); } catch(e) { videoId = ''; }
    } else if (url.includes('youtube.com/embed/')) {
        videoId = url.split('youtube.com/embed/')[1].split('?')[0];
    }
    return videoId ? `https://www.youtube-nocookie.com/embed/${videoId}` : '';
}

function fixImageUrl(path) {
    if (!path) return '';
    if (path.startsWith('http')) return path;
    return SAMURAI_BASE_URL + path;
}

function normalizeSlug(slug) {
    if (!slug) return '';
    return slug
        .toLowerCase()
        .replace(/^playstation-/, '')
        .replace(/-[a-f0-9]{6,}$/, '')
        .replace(/[^a-z0-9-]/g, '');
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

const PLACEHOLDER_SVG = `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%231A0A10"/><stop offset="100%" style="stop-color:%230A0A0F"/></linearGradient></defs><rect width="300" height="450" fill="url(%23g)"/><text x="150" y="225" text-anchor="middle" fill="%23E63946" font-size="70">🎮</text><text x="150" y="290" text-anchor="middle" fill="%23B8A0A5" font-size="14" font-family="Tajawal">صورة غير متوفرة</text></svg>`)}`;

// ============================================
// 🎮 1. تحويل منتجات Samurai Games (425)
// ============================================
function transformSamuraiGame(product) {
    // التصنيف من Samurai
    let category = 'other';
    let badge = { text: 'متاح', type: 'badge-other' };
    
    if (product.preorder) {
        category = 'pre';
        badge = { text: 'Pre-Order', type: 'badge-pre' };
    } else if (product.isTopSeller) {
        category = 'hot';
        badge = { text: 'الأكثر مبيعاً', type: 'badge-hot' };
    } else if (product.limitedOffer) {
        category = 'hot';
        badge = { text: 'عرض خاص', type: 'badge-hot' };
    }
    
    const variants = (product.variants || [])
        .filter(v => v.isActive)
        .map(v => {
            const originalPrice = v.oldPrice || v.price;
            const finalPrice = v.price;
            const hasDiscount = v.oldPrice && v.oldPrice > v.price;
            
            return {
                title: v.nameAr || v.name || 'نسخة',
                platform: v.accountType || v.platform || 'PlayStation',
                region: v.region || 'GLOBAL',
                originalPrice: originalPrice,
                price: finalPrice,
                hasDiscount: hasDiscount,
                discountPercentage: v.discount || 0,
                stock: v.stock > 0 && v.isActive
            };
        });
    
    return {
        id: product.id,
        source: 'samurai',
        title: product.titleAr || product.title,
        titleEn: product.title,
        slug: product.slug,
        normalizedSlug: normalizeSlug(product.slug),
        description: product.descriptionAr || product.description || '',
        cover: fixImageUrl(product.image),
        hero: fixImageUrl(product.image),
        video: (product.videos && product.videos[0]) ? product.videos[0].url : '',
        category: category,
        badge: badge.text,
        badgeType: badge.type,
        space: product.gameSizeGb ? product.gameSizeGb + ' GB' : '',
        platforms: product.platform || 'PlayStation',
        genres: (product.genres || []).join(' / '),
        variants: variants
    };
}

// ============================================
// 📦 2. تحويل منتجات Samurai Subscriptions (9)
// ============================================
function transformSubscription(product) {
    const variants = (product.variants || [])
        .filter(v => v.isActive)
        .map(v => ({
            title: v.nameAr || v.name || 'نسخة',
            platform: v.accountType || v.platform || 'PlayStation',
            region: v.region || 'GLOBAL',
            originalPrice: v.price,
            price: v.price,
            hasDiscount: false,
            discountPercentage: 0,
            stock: v.stock > 0 || !v.trackStock
        }));
    
    return {
        id: product.id,
        source: 'subscription',
        title: product.titleAr || product.title,
        titleEn: product.title,
        slug: product.slug,
        normalizedSlug: normalizeSlug(product.slug),
        description: product.descriptionAr || product.description || '',
        cover: fixImageUrl(product.image),
        hero: fixImageUrl(product.image),
        video: (product.videos && product.videos[0]) ? product.videos[0].url : '',
        category: 'subscriptions',
        badge: 'اشتراك',
        badgeType: 'badge-sub',
        space: '',
        platforms: 'PlayStation',
        genres: product.subcategory || 'subscription',
        variants: variants
    };
}

// ============================================
// 🎧 3. تحويل منتجات Samurai Accessories (1+)
// ============================================
function transformAccessory(product) {
    const variants = (product.variants || [])
        .filter(v => v.isActive)
        .map(v => ({
            title: v.nameAr || v.name || 'نسخة',
            platform: v.accountType || v.platform || 'PlayStation',
            region: v.region || 'GLOBAL',
            originalPrice: v.price,
            price: v.price,
            hasDiscount: false,
            discountPercentage: 0,
            stock: v.stock > 0 || !v.trackStock
        }));
    
    // لو مفيش variants → نعمل variant وهمي من السعر الأساسي
    if (variants.length === 0 && product.price) {
        variants.push({
            title: 'المنتج',
            platform: 'PlayStation',
            region: 'GLOBAL',
            originalPrice: product.oldPrice || product.price,
            price: product.price,
            hasDiscount: product.oldPrice && product.oldPrice > product.price,
            discountPercentage: product.discount || 0,
            stock: true
        });
    }
    
    return {
        id: product.id,
        source: 'accessory',
        title: product.titleAr || product.title,
        titleEn: product.title,
        slug: product.slug,
        normalizedSlug: normalizeSlug(product.slug),
        description: product.descriptionAr || product.description || '',
        cover: fixImageUrl(product.image),
        hero: fixImageUrl(product.image),
        video: (product.videos && product.videos[0]) ? product.videos[0].url : '',
        category: 'accessories',
        badge: 'إكسسوار',
        badgeType: 'badge-acc',
        space: '',
        platforms: product.platform || 'PlayStation',
        genres: product.subcategory || 'accessories',
        variants: variants
    };
}

// ============================================
// 🔀 دمج Samurai Games + Breakers
// ============================================
function mergeWithBreakers(samuraiGame, breakersProduct) {
    if (!breakersProduct) return samuraiGame;
    
    // ناخد العنوان والوصف والفيديو والتصنيفات والمساحة والمنصات من Breakers
    const genres = (breakersProduct.genres || []).map(g => g.name).join(' / ');
    const spaceMb = breakersProduct.metadata?.spaceUsedMb;
    const spaceGB = spaceMb ? Math.round(spaceMb / 1024) + ' GB' : samuraiGame.space;
    
    // المنصات من variants Breakers
    const platforms = [...new Set((breakersProduct.variants || []).map(v => v.launcher).filter(Boolean))].join(' / ') || samuraiGame.platforms;
    
    // التصنيف من Breakers
    let category = samuraiGame.category;
    let badge = { text: samuraiGame.badge, type: samuraiGame.badgeType };
    
    if (breakersProduct.promotion === 'PRE_ORDER' || (breakersProduct.tags || []).includes('PRE_ORDER')) {
        category = 'pre';
        badge = { text: 'Pre-Order', type: 'badge-pre' };
    } else if ((breakersProduct.tags || []).includes('NEW_ARRIVAL')) {
        category = 'new';
        badge = { text: 'وصل حديثاً', type: 'badge-new' };
    } else if (breakersProduct.promotion === 'FLASH_SALE' || (breakersProduct.tags || []).includes('TOP_SELLERS')) {
        category = 'hot';
        badge = { text: 'الأكثر مبيعاً', type: 'badge-hot' };
    }
    
    return {
        ...samuraiGame,
        title: breakersProduct.title || samuraiGame.title,
        titleEn: breakersProduct.title || samuraiGame.titleEn,
        description: breakersProduct.description || samuraiGame.description,
        video: breakersProduct.videoUrl || samuraiGame.video,
        genres: genres || samuraiGame.genres,
        space: spaceGB,
        platforms: platforms,
        category: category,
        badge: badge.text,
        badgeType: badge.type
    };
}

// ============================================
// 🚀 تحميل كل البيانات
// ============================================
async function loadAllData() {
    try {
        console.log('⏳ جاري تحميل البيانات...');
        
        const [samuraiRes, breakersRes, subsRes, accRes] = await Promise.all([
            fetch(SAMURAI_GAMES_URL).then(r => r.json()).catch(e => { console.warn('Samurai games failed', e); return { products: [] }; }),
            fetch(BREAKERS_URL).then(r => r.json()).catch(e => { console.warn('Breakers failed', e); return []; }),
            fetch(SAMURAI_SUBS_URL).then(r => r.json()).catch(e => { console.warn('Subs failed', e); return { products: [] }; }),
            fetch(SAMURAI_ACC_URL).then(r => r.json()).catch(e => { console.warn('Acc failed', e); return { products: [] }; })
        ]);
        
        // Samurai Games
        const samuraiProducts = samuraiRes.data?.products || samuraiRes.products || samuraiRes || [];
        console.log('✅ Samurai Games:', samuraiProducts.length);
        
        // Breakers
        const breakersProducts = Array.isArray(breakersRes) ? breakersRes : (breakersRes.products || []);
        console.log('✅ Breakers:', breakersProducts.length);
        
        // Subscriptions
        const subsProducts = subsRes.data?.products || subsRes.products || [];
        console.log('✅ Subscriptions:', subsProducts.length);
        
        // Accessories
        const accProducts = accRes.data?.products || accRes.products || [];
        console.log('✅ Accessories:', accProducts.length);
        
        // Map Breakers by slug
        const breakersMap = new Map();
        breakersProducts.forEach(b => {
            breakersMap.set(normalizeSlug(b.slug), b);
        });
        
        // دمج Samurai Games مع Breakers
        const mergedGames = samuraiProducts
            .map(p => {
                const transformed = transformSamuraiGame(p);
                const breakers = breakersMap.get(transformed.normalizedSlug);
                return mergeWithBreakers(transformed, breakers);
            })
            .filter(g => g.title && g.variants.length > 0);
        
        // Subscriptions
        const subscriptions = subsProducts
            .map(transformSubscription)
            .filter(s => s.title && s.variants.length > 0);
        
        // Accessories
        const accessories = accProducts
            .map(transformAccessory)
            .filter(a => a.title && a.variants.length > 0);
        
        // نجمع الكل
        gamesData = [...mergedGames, ...subscriptions, ...accessories];
        
        console.log('🎉 الإجمالي:', gamesData.length);
        console.log('   - ألعاب:', mergedGames.length);
        console.log('   - اشتراكات:', subscriptions.length);
        console.log('   - إكسسوارات:', accessories.length);
        
        return true;
    } catch (err) {
        console.error('❌ فشل التحميل:', err);
        return false;
    }
}

// ============================================
// Hero Slider
// ============================================
function renderHeroSlider() {
    const slider = document.getElementById('heroSlider');
    if (!slider) return;
    
    // أفضل 5 ألعاب (مع صور من PlayStation)
    const heroGames = gamesData
        .filter(g => g.hero && g.variants.length > 0 && g.source === 'samurai')
        .slice(0, 5);
    
    totalSlides = heroGames.length;
    if (totalSlides === 0) {
        slider.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#B8A0A5;">لا توجد ألعاب</div>';
        return;
    }

    let slidesHTML = '';
    let dotsHTML = '';

    heroGames.forEach((game, index) => {
        const availableVariants = game.variants.filter(v => v.stock);
        const minPrice = availableVariants.length
            ? Math.min(...availableVariants.map(v => v.price))
            : Math.min(...game.variants.map(v => v.price));

        slidesHTML += `
            <div class="hero-slide ${index === 0 ? 'active' : ''}"
                 style="background-image: url('${game.hero}');"
                 onclick="showGame('${game.id}')">
                <div class="hero-content">
                    <span class="hero-badge">${game.badge}</span>
                    <h2>${escapeHtml(game.title)}</h2>
                    <span class="hero-price">يبدأ من ${minPrice.toLocaleString()} ج.م</span>
                    <button class="btn-hero">
                        <i class="fas fa-shopping-bag"></i> اطلب الآن
                    </button>
                </div>
            </div>
        `;
        dotsHTML += `<div class="dot ${index === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToSlide(${index})"></div>`;
    });

    slider.innerHTML = slidesHTML + `<div class="slider-dots">${dotsHTML}</div>`;

    clearInterval(sliderInterval);
    sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        goToSlide(currentSlide);
    }, 5000);
}

function goToSlide(index) {
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.dot');
    slides.forEach(s => s.classList.remove('active'));
    dots.forEach(d => d.classList.remove('active'));
    if (slides[index]) slides[index].classList.add('active');
    if (dots[index]) dots[index].classList.add('active');
    currentSlide = index;
}

// ============================================
// رسم الشبكة
// ============================================
function renderGamesGrid(containerId, games, limit) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const displayGames = limit ? games.slice(0, limit) : games;

    if (displayGames.length === 0) {
        container.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 30px;">لا توجد منتجات</p>';
        return;
    }

    container.innerHTML = displayGames.map(game => renderGameCard(game)).join('');
}

function renderGameCard(game) {
    const availableVariants = game.variants.filter(v => v.stock);
    const minPrice = availableVariants.length
        ? Math.min(...availableVariants.map(v => v.price))
        : (game.variants.length ? Math.min(...game.variants.map(v => v.price)) : 0);

    return `
        <div class="game-card" onclick="showGame('${game.id}')">
            <div class="game-image">
                <img src="${game.cover}" alt="${escapeHtml(game.title)}" loading="lazy"
                     onerror="this.onerror=null; this.src='${PLACEHOLDER_SVG}'">
                <span class="game-badge ${game.badgeType}">${game.badge}</span>
            </div>
            <div class="game-info">
                <h3>${escapeHtml(game.title)}</h3>
                <div class="game-price">
                    ${minPrice ? `يبدأ من ${minPrice.toLocaleString()} <small>ج.م</small>` : 'غير متاح'}
                </div>
            </div>
        </div>
    `;
}

// ============================================
// صفحة المنتج
// ============================================
function showGame(gameId) {
    const game = gamesData.find(g => g.id === gameId);
    if (!game) return;

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-game').classList.add('active');
    if (document.getElementById('mobHome')) document.getElementById('mobHome').classList.remove('active');
    if (document.getElementById('mobGames')) document.getElementById('mobGames').classList.remove('active');

    // تجميع variants حسب المنصة
    const variantsByPlatform = {};
    game.variants.forEach(v => {
        const key = v.platform;
        if (!variantsByPlatform[key]) variantsByPlatform[key] = [];
        variantsByPlatform[key].push(v);
    });

    const renderVariant = (v) => {
        const waMsg = encodeURIComponent(
            `السلام عليكم 🌟\nأريد شراء:\n\n🎮 ${game.title}\n📦 النسخة: ${v.title}\n💻 المنصة: ${v.platform}\n💰 السعر: ${v.price.toLocaleString()} ج.م`
        );
        const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;

        return `
            <div class="variant-item ${v.stock ? '' : 'out-of-stock'}"
                 ${v.stock ? `onclick="window.open('${waLink}', '_blank')"` : ''}>
                <div class="variant-info">
                    <span class="variant-title">${escapeHtml(v.title)}</span>
                    <span class="variant-region"><i class="fas fa-gamepad"></i> ${escapeHtml(v.platform)}</span>
                </div>
                <div class="variant-price-box">
                    ${v.hasDiscount ? `<span class="variant-old-price">${v.originalPrice.toLocaleString()} ج.م</span>` : ''}
                    <span class="variant-price">${v.price.toLocaleString()} ج.م</span>
                    ${!v.stock ? '<small style="color:#E63946;font-size:0.7rem;">غير متاح</small>' : ''}
                </div>
            </div>
        `;
    };

    let variantsHTML = '';
    Object.keys(variantsByPlatform).forEach(platform => {
        let platformIcon = 'gamepad';
        let platformName = platform;
        
        if (platform.includes('ps5') || platform === 'PS5' || platform === 'primary-ps5') { 
            platformIcon = 'playstation'; 
            platformName = platform.includes('primary') ? 'Primary PS5' : 'PlayStation 5'; 
        }
        else if (platform.includes('ps4') || platform === 'PS4' || platform === 'primary-ps4') { 
            platformIcon = 'playstation'; 
            platformName = platform.includes('primary') ? 'Primary PS4' : 'PlayStation 4'; 
        }
        else if (platform === 'secondary') { platformIcon = 'user-friends'; platformName = 'Secondary'; }
        else if (platform === 'full-account') { platformIcon = 'user-check'; platformName = 'Full Account'; }
        else if (platform === 'STEAM') { platformIcon = 'steam'; platformName = 'Steam'; }
        else if (platform.includes('XBOX')) { platformIcon = 'xbox'; platformName = 'Xbox'; }

        const iconClass = platformIcon === 'playstation' ? 'fab fa-playstation' :
                          platformIcon === 'steam' ? 'fab fa-steam' :
                          platformIcon === 'xbox' ? 'fab fa-xbox' :
                          'fas fa-' + platformIcon;

        variantsHTML += `
            <div class="platform-title">
                <i class="${iconClass}"></i>
                ${platformName}
            </div>
            <div class="variants-list">
                ${variantsByPlatform[platform].map(renderVariant).join('')}
            </div>
        `;
    });

    const embedUrl = getEmbedUrl(game.video);

    document.getElementById('gameDetailContent').innerHTML = `
        <div class="game-hero" style="background-image: url('${game.hero}');">
            <div class="game-hero-content">
                <div class="game-cover-box">
                    <img src="${game.cover}" alt="${escapeHtml(game.title)}"
                         onerror="this.onerror=null; this.src='${PLACEHOLDER_SVG}'">
                </div>
                <div class="game-hero-info">
                    <h1>${escapeHtml(game.title)}</h1>
                    <div class="game-meta">
                        ${game.space ? `
                        <div class="meta-item">
                            <span class="meta-label">المساحة</span>
                            <span class="meta-value">${game.space}</span>
                        </div>
                        ` : ''}
                        ${game.platforms ? `
                        <div class="meta-item">
                            <span class="meta-label">المنصات</span>
                            <span class="meta-value">${escapeHtml(game.platforms)}</span>
                        </div>
                        ` : ''}
                        ${game.genres ? `
                        <div class="meta-item">
                            <span class="meta-label">التصنيفات</span>
                            <span class="meta-value">${escapeHtml(game.genres)}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            </div>
        </div>

        <div class="game-detail-grid">
            <div>
                ${embedUrl ? `
                <div class="detail-section">
                    <h2><i class="fas fa-play-circle"></i> فيديو</h2>
                    <div class="video-wrapper">
                        <iframe src="${embedUrl}" allowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                        </iframe>
                    </div>
                </div>
                ` : ''}

                <div class="detail-section">
                    <h2><i class="fas fa-info-circle"></i> عن المنتج</h2>
                    <p>${escapeHtml(game.description) || 'لا يوجد وصف'}</p>
                </div>
            </div>

            <div>
                <div class="detail-section">
                    <h2><i class="fas fa-shopping-cart"></i> اختر النسخة</h2>
                    ${variantsHTML}

                    <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="btn-whatsapp">
                        <i class="fab fa-whatsapp"></i> اطلب الآن عبر واتساب
                    </a>
                </div>
            </div>
        </div>
    `;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================
// التنقل
// ============================================
function showPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + pageName);
    if (target) target.classList.add('active');

    document.querySelectorAll('.mobile-nav-item').forEach(item => item.classList.remove('active'));
    if (pageName === 'home' && document.getElementById('mobHome')) document.getElementById('mobHome').classList.add('active');
    if (pageName === 'all-games' && document.getElementById('mobGames')) document.getElementById('mobGames').classList.add('active');

    if (pageName === 'all-games') renderAllGames();
    if (pageName !== 'game') previousPage = pageName;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() { showPage(previousPage || 'home'); }

// ============================================
// All Games
// ============================================
function getFilteredGames() {
    let filtered = [...gamesData];
    if (currentFilter !== 'all') filtered = filtered.filter(g => g.category === currentFilter);
    if (currentQuery) {
        const q = currentQuery.toLowerCase();
        filtered = filtered.filter(g =>
            g.title.toLowerCase().includes(q) ||
            (g.titleEn && g.titleEn.toLowerCase().includes(q)) ||
            (g.genres && g.genres.toLowerCase().includes(q))
        );
    }
    return filtered;
}

function renderAllGames() {
    const filtered = getFilteredGames();
    const grid = document.getElementById('allGamesGrid');
    const noResults = document.getElementById('noResults');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const resultsCount = document.getElementById('resultsCount');
    const totalCount = document.getElementById('totalCount');

    if (resultsCount) resultsCount.textContent = Math.min(displayedCount, filtered.length);
    if (totalCount) totalCount.textContent = `من أصل ${filtered.length} منتج`;

    if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.add('show');
        loadMoreContainer.style.display = 'none';
        return;
    }

    noResults.classList.remove('show');
    const displayGames = filtered.slice(0, displayedCount);
    grid.innerHTML = displayGames.map(renderGameCard).join('');
    loadMoreContainer.style.display = displayedCount < filtered.length ? 'block' : 'none';
}

function loadMore() {
    displayedCount += GAMES_PER_PAGE;
    renderAllGames();
}

function filterFromNav(filter) {
    currentFilter = filter;
    currentQuery = '';
    displayedCount = GAMES_PER_PAGE;

    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
    });

    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.value = '';

    showPage('all-games');
}

// ============================================
// بدء التشغيل
// ============================================
async function init() {
    const ok = await loadAllData();

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';

    if (!ok || gamesData.length === 0) {
        document.getElementById('mainContent').innerHTML = `
            <div style="text-align:center;padding:80px 20px;">
                <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#E63946;margin-bottom:20px;"></i>
                <h2 style="color:#fff;margin-bottom:10px;">فشل تحميل البيانات</h2>
                <p style="color:#B8A0A5;">تأكد من اتصالك بالإنترنت وحاول مرة أخرى</p>
                <button onclick="location.reload()" style="margin-top:20px;background:linear-gradient(135deg,#E63946,#8B0000);color:#fff;padding:12px 30px;border-radius:50px;font-weight:800;cursor:pointer;border:none;">إعادة المحاولة</button>
            </div>
        `;
        return;
    }

    renderHeroSlider();
    renderGamesGrid('preGrid', gamesData.filter(g => g.category === 'pre'), 10);
    renderGamesGrid('newGrid', gamesData.filter(g => g.category === 'new'), 10);
    renderGamesGrid('hotGrid', gamesData.filter(g => g.category === 'hot'), 10);
    renderGamesGrid('subsGrid', gamesData.filter(g => g.category === 'subscriptions'), 10);
    renderGamesGrid('accGrid', gamesData.filter(g => g.category === 'accessories'), 10);

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            currentQuery = e.target.value.trim();
            displayedCount = GAMES_PER_PAGE;
            renderAllGames();
        });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            displayedCount = GAMES_PER_PAGE;
            renderAllGames();
        });
    });
}

document.addEventListener('DOMContentLoaded', init);
</script>
